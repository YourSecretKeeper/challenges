<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Price Finder</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">PRODUCT EXPLORER · CHALLENGE 01</p>
      <h1>Smart Price Finder</h1>
      <p class="subtitle">Find products closest to your target price using efficient searching.</p>
    </div>
  </header>
  <main class="container">
    <section class="search-panel">
      <div class="field">
        <label for="price-input">Target price</label>
        <div class="input-row">
          <span class="currency">₹</span>
          <input id="price-input" type="number" min="0" step="1" placeholder="70000">
          <button id="search-btn">Find Products</button>
        </div>
      </div>

      <div class="range-row">
        <div class="field">
          <label for="min-price">Minimum price <span>(optional)</span></label>
          <input id="min-price" type="number" min="0" placeholder="50000">
        </div>
        <div class="field">
          <label for="max-price">Maximum price <span>(optional)</span></label>
          <input id="max-price" type="number" min="0" placeholder="80000">
        </div>
        <button id="range-btn" class="secondary-btn">Find In Range</button>
      </div>
    </section>

    <section class="results-section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">RESULTS</p>
          <h2 id="results-title">Closest Products</h2>
        </div>
        <span id="result-count" class="count-badge">0 results</span>
      </div>

      <div id="results" class="product-grid"></div>

      <div id="empty-state" class="empty-state hidden">
        <div class="empty-icon">⌕</div>
        <h3>No products found</h3>
        <p>Try another price or a wider range.</p>
      </div>
    </section>
  </main>

  <div id="product-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card">
      <button class="close-btn" data-close-modal aria-label="Close">×</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- IMPORTANT: replace js/data.js with your teacher's supplied data.js -->
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/features/priceFinder.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
